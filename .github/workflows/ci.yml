name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Monday 06:00 UTC — the "does it still build against current V" ritual
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# No third-party action installs V anymore. Both "official shortcuts" proved
# broken in 2026 for real projects: `vlang/setup-v@v1.4` exits success but
# the compiler it sets up cannot find vlib (v-analyzer's CI — the reference
# user — has been red for the same reason), and the official release zips
# omit stdlib modules (0.5.2 ships without vlib/json2 at all, so even
# `import json2` cannot compile). This project needs current master's stdlib
# (the `mcp` and `json2` modules surfaced there more recently than 0.5.2),
# so every job builds V from master with the plain `git clone + make`
# recipe — exactly what vlang.io tells every developer to run.

jobs:
  test:
    name: v test . (V master)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install V (source-built, current master)
        run: |
          git clone -q --depth 1 https://github.com/vlang/v /tmp/vsrc
          make -C /tmp/vsrc || make -C /tmp/vsrc
          echo /tmp/vsrc >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: v version (sanity)
        run: v version

      - name: Install the vrepo and vaffected dependencies
        run: v install gil-silva.vrepo gil-silva.vaffected

      - name: Build
        run: v -no-parallel -o bin/v-mcp-server .

      - name: Run tests (includes the stdio client/server round trip)
        run: v test .

      - name: Smoke script
        run: v run smoke.vsh

  lint:
    name: formatting + vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install V (source-built, current master)
        run: |
          git clone -q --depth 1 https://github.com/vlang/v /tmp/vsrc
          make -C /tmp/vsrc || make -C /tmp/vsrc
          echo /tmp/vsrc >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: v version (sanity)
        run: v version

      - name: Install the vrepo and vaffected dependencies
        run: v install gil-silva.vrepo gil-silva.vaffected

      - name: v fmt -c (strict)
        run: v fmt -c .

      - name: v vet (informational)
        run: 'v vet . || echo "vet: found warnings (informational only)"'
